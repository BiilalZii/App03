<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>الخدمات الاجتماعية - الأغواط</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;--card:#162032;--card2:#1c2a3f;--primary:#3b82f6;--primary2:#2563eb;
  --accent:#22c55e;--danger:#ef4444;--warn:#f59e0b;
  --text:#f1f5f9;--muted:#94a3b8;--border:#2a3a52;--input:#0f172a;
  --radius:14px;--shadow:0 8px 30px rgba(0,0,0,.35);
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:76px;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,#1e3a5f,#152a4a);padding:14px 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.4)}
header h1{font-size:1.12rem;font-weight:700}
header p{font-size:.72rem;color:var(--muted);margin-top:3px}
.nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(22,32,50,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);z-index:100;justify-content:space-around;padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.nav button{background:none;border:none;color:var(--muted);font-size:.68rem;padding:6px 2px;flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.nav button.active{color:var(--primary)}
.nav button span{font-size:1.2rem;line-height:1}
.page{display:none;padding:12px;max-width:720px;margin:0 auto}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 10px;text-align:center;border:1px solid var(--border)}
.stat .n{font-size:1.4rem;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted);margin-top:4px}
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:1rem;outline:none;font-family:inherit}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.search-box button{padding:13px 18px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;font-size:.9rem}
.item{background:var(--card);border-radius:12px;padding:13px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;transition:transform .12s,background .12s}
.item:active{transform:scale(.985);background:var(--card2)}
.item .name{font-weight:600;font-size:.95rem}
.item .meta{font-size:.76rem;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.68rem;background:#1e3a5f;color:#93c5fd;font-weight:500}
.badge.red{background:#3f1212;color:#fca5a5}
.badge.green{background:#0a2e1a;color:#86efac}
.badge.orange{background:#3b2a0a;color:#fcd34d}
.badge.yellow{background:#3f3c0a;color:#fde047}
.badge.gray{background:#1e293b;color:#94a3b8}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:.88rem;gap:12px}
.detail-row:last-child{border:none}
.detail-row .k{color:var(--muted);flex-shrink:0}
.detail-row .v{font-weight:600;text-align:left;max-width:62%;word-break:break-all}
.section-title{font-size:.88rem;color:var(--primary);margin:18px 0 8px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:.88rem}
.money{font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-size:.85rem;margin-bottom:10px;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 0}
.filter-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-row select,.filter-row input{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:.85rem;font-family:inherit}
.top-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:11px 16px;border-radius:11px;border:none;font-weight:600;cursor:pointer;font-size:.85rem;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97);opacity:.9}
.btn-primary{background:var(--primary);color:#fff}
.btn-green{background:var(--accent);color:#052e16}
.btn-red{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost{background:rgba(59,130,246,.12);color:var(--primary);border:none}
.btn-sm{padding:7px 12px;font-size:.75rem;border-radius:9px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.item .actions{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;padding:0;animation:slideUp .25s ease-out;box-shadow:var(--shadow)}
.modal-header{position:sticky;top:0;background:var(--card);padding:16px 18px 12px;border-bottom:1px solid var(--border);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-header h3{font-size:1.05rem;font-weight:700}
.modal-close{background:var(--card2);border:none;color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-body{padding:16px 18px 8px}
.modal-footer{position:sticky;bottom:0;background:var(--card);padding:12px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;z-index:2}
.modal-footer .btn{flex:1;padding:13px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.form-group label .req{color:var(--danger);margin-right:3px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--input);color:var(--text);font-size:1rem;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.form-group input.error,.form-group select.error{border-color:var(--danger)}
.form-group .hint{font-size:.7rem;color:var(--muted);margin-top:4px}
.form-group .err-msg{font-size:.72rem;color:var(--danger);margin-top:4px;display:none}
.form-group.has-error .err-msg{display:block}
.form-group textarea{min-height:72px;resize:vertical}
.form-section{margin:16px 0 8px;padding:8px 0 4px;border-top:1px solid var(--border);font-size:.8rem;color:var(--primary);font-weight:700}
.emp-picker{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:11px;background:var(--input);margin-top:6px;display:none}
.emp-picker.open{display:block}
.emp-picker .ep-item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:.85rem}
.emp-picker .ep-item:last-child{border:none}
.emp-picker .ep-item:active{background:var(--card2)}
.emp-picker .ep-item small{color:var(--muted);display:block;margin-top:2px}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-10px);background:#166534;color:#dcfce7;
  padding:11px 20px;border-radius:12px;z-index:300;font-weight:600;font-size:.85rem;display:none;opacity:0;transition:all .25s;box-shadow:var(--shadow);white-space:nowrap;max-width:90%}
.toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#7f1d1d;color:#fecaca}
.confirm-box{text-align:center;padding:8px 0 4px}
.confirm-box .icon{font-size:2.2rem;margin-bottom:8px}
.confirm-box p{color:var(--muted);font-size:.9rem;line-height:1.5}
.emp-header h2{font-size:1.12rem;line-height:1.3}
.type-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.type-chip{padding:8px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--input);color:var(--text);font-size:.78rem;cursor:pointer;font-family:inherit}
.type-chip.active{border-color:var(--primary);background:rgba(59,130,246,.2);color:#93c5fd}
.type-chip small{display:block;color:var(--muted);font-size:.68rem;margin-top:2px}
/* ── التقارير ── */
.report-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.report-table{width:100%;border-collapse:collapse;font-size:.78rem}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.report-table th,.report-table td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.report-table th{color:var(--muted);font-weight:600;font-size:.72rem;background:var(--card2)}
.report-table tr:last-child td{border-bottom:none}
.report-table td.num{font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:64px 1fr 96px;gap:8px;align-items:center;margin:7px 0;font-size:.74rem}
.bar-row>span:first-child{color:var(--muted)}
.bar-row .money{text-align:left;font-variant-numeric:tabular-nums}
.bar-track{background:var(--input);border-radius:6px;height:14px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#60a5fa);border-radius:6px}
.report-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.report-chips select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:.85rem;font-family:inherit}
/* ── مخطط دائري & مؤشرات ── */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:8px}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0;margin:0 auto}
.donut::after{content:'';position:absolute;inset:30px;background:var(--card);border-radius:50%}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.donut-center .n{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}
.donut-center .l{font-size:.62rem;color:var(--muted)}
.donut-legend{flex:1;min-width:180px;font-size:.76rem}
.legend-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}
.legend-item:last-child{border:none}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-item .nm{flex:1;display:flex;flex-direction:column;min-width:0}
.legend-item .nm small{color:var(--muted);font-size:.68rem}
.legend-item .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:left}
.rate-bar{height:10px;background:var(--input);border-radius:6px;overflow:hidden}
.rate-fill{height:100%;background:linear-gradient(90deg,var(--accent),#4ade80);border-radius:6px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 4px}
.pager button{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:.8rem}
.pager button:disabled{opacity:.4;cursor:default}
.pager span{font-size:.8rem;color:var(--muted)}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.guide-grid{grid-template-columns:1fr}}
.guide-tile{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px}
.guide-tile .ic{font-size:1.4rem}
.guide-tile h4{font-size:.86rem;margin:6px 0 3px}
.guide-tile p{font-size:.74rem;color:var(--muted);line-height:1.6}
/* ── أزرار الترويسة ── */
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hdr-actions{display:flex;gap:6px;flex-shrink:0}
.hdr-actions button{background:var(--card2);border:1px solid var(--border);color:var(--text);min-width:36px;height:36px;border-radius:10px;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 8px;font-family:inherit}
.hdr-actions button:active{transform:scale(.94)}
/* ── الوضع النهاري ── */
body.light{--bg:#eef2f7;--card:#ffffff;--card2:#e6ecf3;--primary:#2563eb;--primary2:#1d4ed8;--text:#0f172a;--muted:#5b6b7f;--border:#c9d5e3;--input:#ffffff;--shadow:0 8px 30px rgba(15,23,42,.10)}
body.light .nav{background:rgba(255,255,255,.97)}
body.light .badge{background:#dbeafe;color:#1d4ed8}
body.light .badge.red{background:#fee2e2;color:#b91c1c}
body.light .badge.green{background:#dcfce7;color:#15803d}
body.light .badge.orange{background:#ffedd5;color:#c2410c}
body.light .badge.yellow{background:#fef9c3;color:#a16207}
body.light .badge.gray{background:#e2e8f0;color:#475569}
body.light .type-chip.active{background:#dbeafe;color:#1d4ed8}
body.light .toast{background:#14532d;color:#dcfce7}
body.light .toast.err{background:#7f1d1d;color:#fecaca}
/* ── شاشة القفل PIN ── */
#lock-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
#lock-screen.open{display:flex}
.lock-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;width:100%;max-width:340px;text-align:center;box-shadow:var(--shadow)}
.lock-card .ic{font-size:2.4rem}
.lock-card h2{font-size:1.05rem;margin:8px 0 4px}
.lock-card p{font-size:.75rem;color:var(--muted)}
.lock-card input{width:100%;margin:14px 0 10px;padding:13px;border-radius:12px;border:1.5px solid var(--border);background:var(--input);color:var(--text);font-size:1.3rem;text-align:center;letter-spacing:.5em;outline:none;font-family:inherit}
.lock-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.lock-card .btn{width:100%;padding:12px}
.lock-err{color:var(--danger);font-size:.75rem;min-height:1.1em;margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
/* ── لافتات التنبيه ── */
.note-banner{border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:.8rem;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;border:1px solid;font-weight:500}
.note-banner .btn{flex-shrink:0}
.note-banner.warn{background:#3b2a0a;border-color:#7a5a10;color:#fde047}
.note-banner.danger{background:#3f1212;border-color:#7f1d1d;color:#fca5a5}
.note-banner.ok{background:#0a2e1a;border-color:#14532d;color:#86efac}
body.light .note-banner.warn{background:#fef3c7;border-color:#f59e0b;color:#92400e}
body.light .note-banner.danger{background:#fee2e2;border-color:#ef4444;color:#991b1b}
body.light .note-banner.ok{background:#dcfce7;border-color:#22c55e;color:#166534}
/* ── سجل الحالة ── */
.log-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.78rem;align-items:flex-start}
.log-item:last-child{border:none}
.log-item .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:6px}
.log-item .d{color:var(--muted);font-size:.7rem;white-space:nowrap}
/* ── الطباعة ── */
#print-area{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff !important}
  body > *:not(#print-area){display:none !important}
  #print-area{display:block !important;color:#000;font-size:13px;line-height:1.5}
  #print-area *{color:#000 !important;background:transparent !important}
  #print-area h1{font-size:20px;text-align:center;margin-bottom:2px}
  #print-area h2{font-size:15px;border-bottom:2px solid #222;margin:16px 0 8px;padding-bottom:4px}
  #print-area .ph{text-align:center;font-size:12px;margin-bottom:12px}
  #print-area .pk{display:inline-block;background:#eee !important;padding:2px 10px;border-radius:6px;font-size:12px}
  #print-area table{width:100%;border-collapse:collapse;margin:8px 0}
  #print-area th,#print-area td{border:1px solid #555;padding:5px 8px;text-align:right;vertical-align:top}
  #print-area th{background:#e5e7eb !important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-area td{background:#fff !important}
  #print-area p{margin:6px 0}
}
</style>
</head>
<body>
<header>
  <div class="hdr-row">
    <div>
      <h1>🏛️ الخدمات الاجتماعية</h1>
      <p>ولاية الأغواط — بدون إنترنت · قابل للتعديل</p>
    </div>
    <div class="hdr-actions">
      <button type="button" id="btn-theme" title="الوضع الليلي/النهاري" onclick="toggleTheme()">☀️</button>
      <button type="button" id="btn-rip" title="إظهار/إخفاء أرقام RIP" onclick="toggleRip()">🙈</button>
      <button type="button" id="btn-lock" title="قفل التطبيق (PIN)" onclick="lockNow()">🔒</button>
      <button type="button" title="الإعدادات" onclick="openSettings()">⚙️</button>
    </div>
  </div>
</header>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>
<div id="print-area"></div>
<div id="lock-screen">
  <div class="lock-card" id="lock-card">
    <div class="ic">🔒</div>
    <h2>التطبيق مقفل</h2>
    <p>أدخل رمز PIN للمتابعة</p>
    <input type="password" id="lock-pin" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <button type="button" class="btn btn-primary" onclick="unlockApp()">فتح القفل</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<div id="page-home" class="page active">
  <div id="backup-note"></div>
  <div class="top-bar">
    <button class="btn btn-primary btn-sm" onclick="showPage('reports')">📊 التقارير</button>
    <button class="btn btn-green btn-sm" onclick="exportData()">⬇️ تصدير</button>
    <button class="btn btn-outline btn-sm" onclick="importData()">⬆️ استيراد</button>
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('csv-file').click()">📥 استيراد CSV</button>
    <button class="btn btn-outline btn-sm" onclick="resetData()">↺ الأصلية</button>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="handleImport(event)">
    <input type="file" id="csv-file" accept=".csv,text/csv" style="display:none" onchange="handleCsvImport(event)">
  </div>
  <div class="stats" id="stats"></div>
  <div id="perf"></div>
  <div id="orphan-reqs"></div>
  <div class="section-title">آخر المنح</div>
  <div id="recent-aides"></div>
</div>

<div id="page-search" class="page">
  <div class="search-box">
    <input type="search" id="q" placeholder="بحث شامل: اسم، رقم، RIP، نوع منحة/قرض..." enterkeyhint="search" autocomplete="off">
    <button type="button" onclick="doSearch()">بحث</button>
  </div>
  <div class="filter-row">
    <select id="emp-sex" onchange="doSearch()">
      <option value="">كل الأجناس</option>
      <option value="M">👨 ذكر</option>
      <option value="F">👩 أنثى</option>
      <option value="none">غير محدد</option>
    </select>
    <select id="emp-age" onchange="doSearch()">
      <option value="">كل الأعمار</option>
      <option value="lt30">أقل من 30 سنة</option>
      <option value="30-39">30 - 39 سنة</option>
      <option value="40-49">40 - 49 سنة</option>

<script>
const STORAGE_KEY = 'social_db_v3';
let DB = null;
let currentEmpId = null;

/* ═══════ الإعدادات والحماية ═══════ */
const SETTINGS_KEY = 'social_settings_v1';
const PIN_KEY = 'social_pin_v1';
const BACKUP_KEY = 'social_last_backup';
let SETTINGS = {user:'المستخدم', ripHidden:true, theme:'dark'};
function loadSettings(){
  try{ const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)); if(s) SETTINGS={...SETTINGS,...s}; }catch(e){}
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); }catch(e){} }
async function hashPin(p){
  const s='social-app03::'+p;
  try{
    if(crypto && crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; }
  return 'fnv:'+Math.abs(h).toString(16);
}
function pinIsSet(){ return !!localStorage.getItem(PIN_KEY); }
function initLock(){
  const locked = pinIsSet();
  const ls=document.getElementById('lock-screen');
  if(locked){ ls.classList.add('open'); setTimeout(()=>{ const i=document.getElementById('lock-pin'); if(i) i.focus(); },120); }
  else ls.classList.remove('open');
}
function lockNow(){
  if(!pinIsSet()){ openSettings('pin'); return; }
  document.getElementById('lock-err').textContent='';
  document.getElementById('lock-pin').value='';
  document.getElementById('lock-screen').classList.add('open');
}
async function unlockApp(){
  const v=document.getElementById('lock-pin').value.trim();
  if(!v) return;
  const h=await hashPin(v);
  if(h===localStorage.getItem(PIN_KEY)){
    document.getElementById('lock-screen').classList.remove('open');
    toast('مرحباً بك 👋');
  }else{
    document.getElementById('lock-err').textContent='رمز غير صحيح، حاول مجدداً';
    const card=document.getElementById('lock-card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    document.getElementById('lock-pin').value='';
  }
}
function maskRip(v){
  if(v==null||v==='') return v;
  const s=String(v);
  if(!SETTINGS.ripHidden) return s;
  if(s.length<=8) return '••••••';
  return s.slice(0,6)+'••••••••'+s.slice(-4);
}
function toggleRip(){
  SETTINGS.ripHidden=!SETTINGS.ripHidden; saveSettings();
  document.getElementById('btn-rip').textContent = SETTINGS.ripHidden ? '🙈' : '👁️';
  rerenderCurrent();
  toast(SETTINGS.ripHidden ? 'تم إخفاء أرقام RIP 🙈' : 'أرقام RIP ظاهرة الآن 👁️');
}
function toggleTheme(){
  SETTINGS.theme = SETTINGS.theme==='dark' ? 'light' : 'dark';
  applyTheme(); saveSettings();
}
function applyTheme(){
  document.body.classList.toggle('light', SETTINGS.theme==='light');
  const b=document.getElementById('btn-theme'); if(b) b.textContent = SETTINGS.theme==='light' ? '🌙' : '☀️';
}
function rerenderCurrent(){
  const active=document.querySelector('.page.active'); if(!active) return;
  const name=active.id.replace('page-','');
  if(name==='employee' && currentEmpId!=null) openEmployee(currentEmpId); else showPage(name);
}
function openSettings(focus){
  const hasPin=pinIsSet();
  openModal({
    title:'⚙️ الإعدادات', saveLabel:'حفظ',
    fields:[
      {name:'user', label:'اسم المستخدم (يُوثَّق في سجل تغيير الحالات)', value:SETTINGS.user},
      {type:'raw', html:`<div class="form-group"><label>حماية التطبيق</label>
        <div class="btn-row" style="margin:0">
          <button type="button" class="btn ${hasPin?'btn-outline':'btn-primary'} btn-sm" onclick="askSetPin()">${hasPin?'🔑 تغيير رمز PIN':'🔑 تعيين رمز PIN'}</button>
          ${hasPin?'<button type="button" class="btn btn-red btn-sm" onclick="removePin()">🗑️ إزالة الرمز</button>':''}
        </div>
        <div class="hint">${hasPin?'التطبيق مقفل برمز PIN — يُطلب عند كل فتح للصفحة':'لا يوجد رمز — أي شخص يفتح الملف يمكنه رؤية البيانات'}</div></div>`},
      {type:'raw', html:`<div class="form-group"><label>خصوصية أرقام RIP</label>
        <button type="button" class="btn ${SETTINGS.ripHidden?'btn-green':'btn-outline'} btn-sm" onclick="toggleRip();closeModal();openSettings()">${SETTINGS.ripHidden?'🙈 الأرقام مخفية — اضغط للإظهار':'👁️ الأرقام ظاهرة — اضغط للإخفاء'}</button>
        <div class="hint">عند الإخفاء تظهر أرقام الحساب البنكي مقنّعة في كل الصفحات والتقارير والطباعة</div></div>`},
      {type:'raw', html:`<div class="form-group"><label>المظهر</label>
        <button type="button" class="btn btn-outline btn-sm" onclick="toggleTheme();closeModal();openSettings()">${SETTINGS.theme==='light'?'🌙 التبديل للوضع الليلي':'☀️ التبديل للوضع النهاري'}</button></div>`},
    ],
    onSave: vals=>{
      SETTINGS.user=(vals.user||'المستخدم').trim()||'المستخدم';
      saveSettings(); closeModal(); toast('تم حفظ الإعدادات ✓');
    }
  });
  if(focus==='pin') setTimeout(()=>askSetPin(),150);
}
function askSetPin(){
  openModal({
    title:'🔑 تعيين رمز PIN', saveLabel:'حفظ الرمز',
    fields:[
      {name:'pin1', label:'الرمز الجديد (4 إلى 8 أرقام)', required:true, type:'password', inputmode:'numeric', attrs:'maxlength="8"'},
      {name:'pin2', label:'تأكيد الرمز', required:true, type:'password', inputmode:'numeric', attrs:'maxlength="8"'},
    ],
    onSave: async vals=>{
      const p1=vals.pin1.trim(), p2=vals.pin2.trim();
      if(!/^\d{4,8}$/.test(p1)){ toast('الرمز يجب أن يكون من 4 إلى 8 أرقام', true); return; }
      if(p1!==p2){ toast('الرمزان غير متطابقين', true); return; }
      localStorage.setItem(PIN_KEY, await hashPin(p1));
      toast('تم تعيين رمز PIN ✓');
      closeModal(); openSettings();
    }
  });
}
function removePin(){
  openConfirm({
    title:'إزالة رمز PIN', yesLabel:'إزالة',
    message:'سيتم إلغاء القفل برمز PIN. هل أنت متأكد؟',
    onYes:()=>{ localStorage.removeItem(PIN_KEY); toast('تمت إزالة الرمز'); closeModal(); openSettings(); }
  });
}

function birthDate(d){
  if(d==null) return null;
  const m=String(d).trim().match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(!m) return null;
  let yyyy=+m[3]; if(yyyy<100) yyyy+= yyyy>50?1900:2000;
  if(yyyy<1900||yyyy>2100) return null;
  return {dd:+m[1], mm:+m[2], yyyy};
}
function ageOf(d){
  const b=birthDate(d); if(!b) return null;
  const t=new Date();
  let age=t.getFullYear()-b.yyyy;
  const md=(t.getMonth()+1)-b.mm;
  if(md<0 || (md===0 && t.getDate()<b.dd)) age--;
  return age;
}
function ageMatches(range, age){
  if(range==='unknown') return age==null;
  if(age==null) return false;
  if(range==='lt30') return age<30;
  if(range==='30-39') return age>=30 && age<40;
  if(range==='40-49') return age>=40 && age<50;
  if(range==='50-59') return age>=50 && age<60;
  if(range==='ge60') return age>=60;
  return true;
}
function sexLabel(e){ return e.sex==='M'?'ذكر':e.sex==='F'?'أنثى':'—'; }
function empAgeBadge(e){
  const a=ageOf(e.date_naissance);
  return a!=null?`<span class="badge gray">${a} سنة</span>`:'';
}

const MALE_NAME_SET=new Set(MALE_NAMES_AR.concat(MALE_NAMES_LATIN).map(normNameKey).filter(Boolean));
const FEMALE_NAME_SET=new Set(FEMALE_NAMES_AR.concat(FEMALE_NAMES_LATIN).map(normNameKey).filter(Boolean));
const AMBIG_NAME_SET=new Set(AMBIG_NAMES_AR.concat(AMBIG_NAMES_LATIN).map(normNameKey).filter(Boolean));
const LATIN_MALE_A_END=new Set(['hamza','reda','ridha','aissa','mustapha','mustafa','mostapha','moustafa']);

function toLatinDigits(s){
  return String(s==null?'':s)
    .replace(/[٠-٩]/g, d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))
    .replace(/[۰-۹]/g, d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
}
function normNameKey(s){
  return String(s==null?'':s)
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/ئ/g,'ي').replace(/ؤ/g,'و').replace(/ء/g,'')
    .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\u0600-\u06FF]/g,'');
}
/* كشف الجنس من نص اسم (عربي أو لاتيني) — يعيد 'M' أو 'F' أو null */
function detectGenderText(name){
  const toks=String(name||'').trim().split(/[\s\-_.\/,،؛;:()]+/).filter(t=>/[a-zA-Z\u0600-\u06FF]/.test(t));
  if(!toks.length) return null;
  const kFirst=normNameKey(toks[0]);
  const firstAmbig=AMBIG_NAME_SET.has(kFirst)||(kFirst.length>3&&kFirst.indexOf('ال')===0&&AMBIG_NAME_SET.has(kFirst.slice(2)));
  let firstM=-1, firstF=-1;
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    const isAr=/[\u0600-\u06FF]/.test(t);
    const k=normNameKey(t);
    if(!k) continue;
    if(isAr){
      if(k==='بن') continue;
      if(k==='بنت'||k==='ام'){ if(firstF<0) firstF=i; continue; }
      if(k==='الدين'||k==='دين'||k==='العابدين'){ if(firstM<0) firstM=i; continue; }
      if(k.startsWith('عبد')){ if(firstM<0) firstM=i; continue; }
    }
    let g='';
    if(MALE_NAME_SET.has(k)) g='M';
    else if(FEMALE_NAME_SET.has(k)) g='F';
    else if(AMBIG_NAME_SET.has(k)) g='A';
    else if(isAr&&k.length>3&&k.indexOf('ال')===0){
      const s=k.slice(2);
      if(MALE_NAME_SET.has(s)) g='M';
      else if(FEMALE_NAME_SET.has(s)) g='F';
      else if(AMBIG_NAME_SET.has(s)) g='A';
    }
    if(!g) continue;
    if(firstAmbig&&i>0&&g!=='F') continue;
    if(g==='M'){ if(firstM<0) firstM=i; continue; }
    if(g==='F'){ if(firstF<0) firstF=i; continue; }
  }
  if(firstM>=0&&firstF>=0) return firstM<firstF?'M':'F';
  if(firstM>=0) return 'M';
  if(firstF>=0) return 'F';
  /* قواعد احتياطية محافظة على أول كلمة */
  const t0=toks[0], k0=normNameKey(t0), isAr0=/[\u0600-\u06FF]/.test(t0);
  if(AMBIG_NAME_SET.has(k0)) return null;   /* اسم ثنائي الجنس: لا نُقرر آلياً */
  if(isAr0){
    if(k0.startsWith('عبد')) return 'M';
    const tail=t0.replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا');
    if(/ة$/.test(tail)) return 'F';
  } else {
    if(/(a|ah|ha)$/.test(k0)&&!LATIN_MALE_A_END.has(k0)) return 'F';
  }
  return null;
}
/* كشف الجنس لموظف: الاسم الشخصي بالعربية أولاً ثم الاسم اللاتيني (اللقب ثم الاسم) */
function detectGenderForEmp(e){
  if(!e) return null;
  const pre=String(e.prenom_ar||'').trim();
  if(pre&&normNameKey(pre)!=='inconnu'){
    const d=detectGenderText(pre);
    if(d) return d;
  }
  const lat=String(e.nom_prenom||'').trim();
  if(lat&&normNameKey(lat)!=='inconnu'){
    const toks=lat.split(/[\s\-.]+/).filter(t=>/[a-zA-Z]/.test(t));
    /* الصيغة اللاتينية «اللقب ثم الاسم الشخصي»: نعتمد الاسم الأخير فقط (لا اللقب) */
    if(toks.length){
      /* «BEN X» نسبة لاسم الأم/الأب → صاحبها ذكر */
      if(toks.length>=2 && /^ben$/i.test(toks[toks.length-2])) return 'M';
      const dLast=detectGenderText(toks[toks.length-1]);
      if(dLast) return dLast;
    }
  }
  return null;
}
/* حالة RIP: 20 رقماً بالضبط + غير مكرر */
function ripStatusOf(e){
  const r=toLatinDigits(String(e&&e.rip!=null?e.rip:'')).replace(/[\s\-.]/g,'');
  if(!r) return {ok:false, code:'missing', label:'بدون RIP', short:'مفقود'};
  if(!/^\d+$/.test(r)) return {ok:false, code:'chars', label:'RIP غير رقمي', short:'غير رقمي'};
  if(r.length!==20) return {ok:false, code:'length', label:'طول RIP: '+r.length+' من 20', short:r.length+'/20'};
  const dup=((typeof DB!=='undefined'&&DB&&DB.employees)||[]).find(x=>x&&x.id!==e.id&&toLatinDigits(String(x.rip==null?'':x.rip)).replace(/[\s\-.]/g,'')===r);
  if(dup) return {ok:false, code:'dup', label:'رقم RIP مكرر مع '+esc(dup.prenom_ar&&dup.prenom_ar!=='inconnu'?dup.prenom_ar:(dup.nom_ar||('#'+dup.id))), short:'مكرر'};
  return {ok:true, code:'ok', label:'سليم ✓ 20 رقماً', short:'سليم'};
}
function ripBadgeMini(e){
  const s=ripStatusOf(e);
  if(s.ok) return '';
  return `<span class="badge ${s.code==='missing'?'orange':'red'}" title="${s.label}">RIP: ${s.short}</span>`;
}
function ripBadgeFull(e){
  const s=ripStatusOf(e);
  return s.ok?`<span class="badge green">✓ 20 رقماً</span>`:`<span class="badge ${s.code==='missing'?'orange':'red'}">${s.label}</span>`;
}
/* الهاتف والبريد */
function normalizePhoneDZ(raw){
  let p=toLatinDigits(String(raw==null?'':raw)).replace(/[\s\-().]/g,'');
  if(!p) return '';
  if(p[0]==='+') p='00'+p.slice(1);
  if(p.indexOf('00')===0) p=p.slice(2);
  if(/^213\d{9}$/.test(p)) p='0'+p.slice(3);
  return p;
}
function phoneStatusOf(e){
  const p=String(e&&e.tel||'').trim();
  if(!p) return {ok:false, label:'بدون رقم'};
  if(/^0[567]\d{8}$/.test(p)) return {ok:true, label:'موبايل'};
  if(/^0[2-49]\d{6,8}$/.test(p)) return {ok:true, label:'أرضي'};
  return {ok:false, label:'صيغة غير صحيحة'};
}
function emailOk(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim()); }
/* تحذير لطيف قبل الحفظ عند وجود مشاكل في RIP/الهاتف/البريد */
function warnInvalidEmpInfo(vals, proceed){
  const probs=[];
  const rip=toLatinDigits(String(vals.rip||'')).replace(/[\s\-.]/g,'');
  if(rip&&!/^\d+$/.test(rip)) probs.push('RIP يحتوي على محارف غير رقمية');
  else if(rip&&rip.length!==20) probs.push('RIP يجب أن يكون 20 رقماً بالضبط (المُدخل: '+rip.length+' رقماً)');
  const tel=normalizePhoneDZ(vals.tel);
  if(tel&&!phoneStatusOf({tel}).ok) probs.push('رقم الهاتف بصيغة غير معتادة: '+tel);
  if(vals.email&&!emailOk(vals.email)) probs.push('البريد الإلكتروني غير صالح: '+vals.email);
  if(!probs.length){ proceed(); return; }
  openConfirmEx({
    title:'⚠️ مراجعة البيانات قبل الحفظ', yesLabel:'حفظ على أي حال', yesClass:'btn-primary',
    html:`<div class="confirm-box" style="text-align:right">
      <p style="margin-bottom:8px">يرجى مراجعة النقاط التالية:</p>
      ${probs.map(p=>`<div class="detail-row"><span class="k">•</span><span class="v">${esc(p)}</span></div>`).join('')}
      <p style="font-size:.72rem;color:var(--muted);margin-top:10px">يمكنك المتابعة إذا كان ذلك مقصوداً.</p>
    </div>`,
    onYes:proceed
  });
}
/* ⚡ استكمال الجنس الناقص للجميع من الأسماء */
function detectAllGenders(){
  const missing=DB.employees.filter(e=>!e.sex);
  if(!missing.length){ toast('كل الموظفين لديهم جنس محدد ✓'); return; }
  const fillable=missing.filter(e=>detectGenderForEmp(e));
  if(!fillable.length){ toast('لم يُمكن التعرف على جنس أيٍّ من الأسماء الناقصة', true); return; }
  openConfirmEx({
    title:'⚡ استكمال الجنس من الأسماء',
    yesLabel:`تعبئة ${fillable.length} موظفاً`, yesClass:'btn-green',
    html:`<div class="confirm-box" style="text-align:right">
      <div class="detail-row"><span class="k">موظفون بدون جنس</span><span class="v">${missing.length}</span></div>
      <div class="detail-row"><span class="k">سيُستكمل من الاسم تلقائياً</span><span class="v" style="color:#4ade80">${fillable.length}</span></div>
      <div class="detail-row"><span class="k">يبقى تحديدها يدوياً</span><span class="v">${missing.length-fillable.length}</span></div>
      <p style="font-size:.72rem;color:var(--muted);margin-top:10px">يعتمد الاستنتاج على قاموس أسماء جزائرية وعربية — يُنصح بمراجعة النتائج عبر فلتر «كل الأجناس ← غير محدد».</p>
    </div>`,
    onYes:()=>{
      let n=0;
      DB.employees.forEach(e=>{ if(!e.sex){ const g=detectGenderForEmp(e); if(g){ e.sex=g; n++; } } });
      saveDB(); renderHome(); rerenderCurrent();
      toast(`تم استكمال جنس ${n} موظفاً من الاسم ✓`);
    }
  });
}

      if(v.length!==20){ setHint('rip','⚠️ يجب 20 رقماً — المُدخل '+v.length,'#fca5a5'); return; }
      const dup=DB.employees.find(x=>x&&toLatinDigits(String(x.rip==null?'':x.rip)).replace(/[\s\-.]/g,'')===v);
      if(dup){ setHint('rip','⚠️ الرقم مستعمل عند '+esc(dup.prenom_ar||dup.nom_ar||('#'+dup.id)),'#fca5a5'); return; }
      setHint('rip','✓ سليم — 20 رقماً','#4ade80');
    };
    rip.addEventListener('input',updRip); updRip();
  }
  if(tel){
    const updTel=()=>{
      const p=normalizePhoneDZ(tel.value);
      if(!p){ setHint('tel','مثال: 0550123456 أو +213550123456'); return; }
      setHint('tel', phoneStatusOf({tel:p}).ok?'✓ رقم صالح':'⚠️ صيغة غير معتادة (موبايل: 05/06/07 + 8 أرقام)', phoneStatusOf({tel:p}).ok?'#4ade80':'#fca5a5');
    };
    tel.addEventListener('input',updTel); updTel();
  }
  if(mail){
    const updMail=()=>{
      const v=String(mail.value||'').trim();
      if(!v){ setHint('email','مثال: name@example.dz'); return; }
      setHint('email', emailOk(v)?'✓ بريد صالح':'⚠️ صيغة غير صحيحة', emailOk(v)?'#4ade80':'#fca5a5');
    };
    mail.addEventListener('input',updMail); updMail();
  }
}

function empFilterPredicate(gSel, aSel, rSel){
  const g=document.getElementById(gSel).value;
  const a=document.getElementById(aSel).value;
  const r=rSel?document.getElementById(rSel).value:'';
  return e => {
    if(g && (g==='none' ? !!e.sex : e.sex!==g)) return false;
    if(a && !ageMatches(a, ageOf(e.date_naissance))) return false;
    if(r){
      const rs=ripStatusOf(e);
      if(r==='err' && rs.ok) return false;
      if(r==='ok' && !rs.ok) return false;
      if(r!=='err' && r!=='ok' && rs.code!==r) return false;
    }
    return true;
  };
}
function applyEmpFilters(list, gSel, aSel, rSel){
  return list.filter(empFilterPredicate(gSel, aSel, rSel));
}
function clearEmpFilters(){
  ['emp-sex','emp-age','emp-rip'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  doSearch();

  if(s==='مؤجل') return `<span class="badge orange">${s}</span>`;

  return `<span class="badge gray">${s}</span>`;
}

function doSearch(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const box = document.getElementById('search-results');
  const empPred = empFilterPredicate('emp-sex','emp-age','emp-rip');
  const hasEmpFilter = !!(document.getElementById('emp-sex').value || document.getElementById('emp-age').value || document.getElementById('emp-rip').value);
  const subPasses = rec => { const e=DB.employees.find(x=>x.id==rec.employee_id); return e?empPred(e):!hasEmpFilter; };

  const empRow = e => `
    <div class="item" onclick="openEmployee(${e.id})">
      <div class="name">${fmt(e.nom_ar)} ${fmt(e.prenom_ar)} <span style="color:var(--muted);font-weight:400">#${e.id}</span></div>
      <div class="meta">
        ${e.sex?`<span>${sexLabel(e)}</span>`:`<span class="badge gray">جنس غير محدد</span>`}${empAgeBadge(e)}
        ${ripBadgeMini(e)}
        <span>${fmt(e.nom_prenom)}</span>
        ${e.rip?`<span style="font-family:ui-monospace,monospace;font-size:.72rem">${maskRip(e.rip)}</span>`:''}
        ${e.tel?`<span>📞 ${fmt(e.tel)}</span>`:''}
        ${e.email?`<span>✉️ ${fmt(e.email)}</span>`:''}
        ${e.credit_restant>0?`<span class="badge red">متبقي ${money(e.credit_restant)}</span>`:''}
        ${e.total_aide>0?`<span class="badge green">منح ${money(e.total_aide)}</span>`:''}
      </div>
    </div>`;

  if(!q){
    let list = [...DB.employees].sort((a,b)=>(a.nom_ar||'').localeCompare(b.nom_ar||'','ar'));
    list = applyEmpFilters(list,'emp-sex','emp-age','emp-rip');
    box.innerHTML = `<div class="section-title" style="margin-top:0">الموظفون (${list.length})</div>` +
      (list.length ? list.map(empRow).join('') : '<div class="empty">لا توجد نتائج مطابقة للفلاتر</div>');
    return;
  }
  const res = DB.employees.filter(e =>
    String(e.id).includes(q) || (e.nom_prenom||'').toLowerCase().includes(q) ||
    (e.nom_ar||'').includes(q) || (e.prenom_ar||'').includes(q) || (e.rip||'').includes(q) ||
    (e.tel||'').includes(q) || (e.email||'').toLowerCase().includes(q)
  ).filter(empPred).slice(0,25);
  const resAides = DB.aides.filter(a =>
    (a.nom_ar||'').includes(q) || (a.prenom_ar||'').includes(q) || (a.type_aide_ar||'').includes(q)
  ).filter(subPasses).slice(0,15);
  const resCredits = DB.credits.filter(c =>
    (c.nom_ar||'').includes(q) || (c.prenom_ar||'').includes(q) || (c.type_credit||'').includes(q) || String(c.annee||'').includes(q)
  ).filter(subPasses).slice(0,15);

  if(!res.length && !resAides.length && !resCredits.length){ box.innerHTML='<div class="empty">لا توجد نتائج</div>'; return; }

  let html = '';
  if(res.length){
    html += `<div class="section-title"><span>👤 الموظفون (${res.length})</span></div>` + res.map(empRow).join('');
  }
  if(resAides.length){
    html += `<div class="section-title"><span>🎁 منح مطابقة (${resAides.length})</span></div>` + resAides.map(a => `
      <div class="item" onclick="openEmployee(${a.employee_id})">
        <div class="name">${fmt(a.nom_ar)} ${fmt(a.prenom_ar)}</div>
        <div class="meta"><span class="badge">${fmt(a.type_aide_ar)}</span><span class="money">${money(a.montant)} دج</span>${statutBadge(a.statut)}<span>${fmt(a.annee)}</span></div>
      </div>`).join('');
  }
  if(resCredits.length){
    html += `<div class="section-title"><span>💳 قروض مطابقة (${resCredits.length})</span></div>` + resCredits.map(c => `
      <div class="item" onclick="openEmployee(${c.employee_id})">
        <div class="name">${fmt(c.nom_ar)} ${fmt(c.prenom_ar)}</div>
        <div class="meta"><span>${fmt(c.type_credit)} ${fmt(c.annee)}</span><span class="money">${money(c.montant)} دج</span>
          ${c.restant>0?`<span class="badge red">متبقي ${money(c.restant)}</span>`:`<span class="badge green">مسدد</span>`}</div>
      </div>`).join('');
  }
  box.innerHTML = html;
}

function nextId(){
  const ids = DB.employees.map(e => +e.id||0);
  return (ids.length ? Math.max(...ids) : 0) + 1;
}
function empName(id){
  const e = DB.employees.find(x=>x.id==id);
  return e ? {nom_ar:e.nom_ar, prenom_ar:e.prenom_ar, rip:e.rip, nom_prenom:e.nom_prenom} : {};
}
function recalcEmp(id){
  const e = DB.employees.find(x=>x.id==id);
  if(!e) return;
  e.total_aide = DB.aides.filter(a=>a.employee_id==id).reduce((s,a)=>s+(+a.montant||0),0);
  e.total_credit = DB.credits.filter(c=>c.employee_id==id).reduce((s,c)=>s+(+c.montant||0),0);
  e.credit_restant = DB.credits.filter(c=>c.employee_id==id).reduce((s,c)=>s+(+c.restant||0),0);
  e.credit_paye = (+e.total_credit||0) - (+e.credit_restant||0);
}

/* ═══════ التسديدات: ربط بالقروض وتحديث المتبقي ═══════ */
function nextCreditId(){
  return DB.credits.reduce((m,c)=>Math.max(m,+c.id||0),0)+1;
}
function ensureCreditIds(){
  let max=DB.credits.reduce((m,c)=>Math.max(m,+c.id||0),0);
  DB.credits.forEach(c=>{ if(c.id==null){ c.id=++max; } });
}
function normalizeDB(){
  ['employees','aides','credits','payments','credit_requests'].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
  ensureCreditIds();
  DB.employees.forEach(e=>{ if(!e.statut_emploi) e.statut_emploi='يعمل'; });
}

}

  return `${fmt(c.type_credit)} ${fmt(c.annee)} · ${creditPersonLabel(c)} — متبقي ${money(c.restant)} دج`;
}
function creditCodeLabel(c){

  if(empId) list = [...list].sort((a,b)=>((a.employee_id==empId?0:1)-(b.employee_id==empId?0:1)));
  return [
    {v:'', t:'— اختر قرضاً/سلفة غير مسدد —'},
    ...list.map(c=>({v:'credit:'+c.id, t:creditOptionLabel(c)})),

  ];

function paymentCreditFromVal(v){

    const c=DB.credits.find(x=>x.id==+v.slice(7));

function bindPaymentCreditSelect(){
  const sel=document.getElementById('f_credit_ref'); if(!sel) return;
  const manual=document.getElementById('fg_code_credit_manual');
  const hintEl=document.getElementById('hint_credit_ref');
  const montEl=document.getElementById('f_montant');
  const detteEl=document.getElementById('f_dette');
  const selectedCredit=()=>{
    const v=sel.value;
    if(v && v.indexOf('credit:')===0) return DB.credits.find(x=>x.id==+v.slice(7));
    return null;
  };
  const refresh=()=>{
    const c=selectedCredit();
    if(manual) manual.style.display=(sel.value==='__custom')?'block':'none';
    if(c){
      const rest=nz(c.restant), mont=nz(montEl?montEl.value:0);
      if(hintEl) hintEl.innerHTML=`المتبقي الحالي: <strong>${money(rest)} دج</strong>${mont>0?` — بعد التسديد: <strong>${money(Math.max(0,rest-mont))} دج</strong>`:''}`;
      if(detteEl && mont>0) detteEl.value=Math.max(0,rest-mont);
    } else if(sel.value==='__custom'){
      if(hintEl) hintEl.textContent='أدخل رمز القرض يدوياً — لن يتم ربطه بسجل قرض تلقائياً';
    } else {
      if(hintEl) hintEl.textContent='اختر قرضاً غير مسدد ليتم خصم المبلغ من المتبقي تلقائياً';
    }
  };
  sel.addEventListener('change', ()=>{
    const c=selectedCredit();
    if(c){
      setEmpPicker('employee_id', c.employee_id);
      if(montEl && !(nz(montEl.value)>0)) montEl.value=c.restant;
    }
    refresh();
  });
  if(montEl) montEl.addEventListener('input', refresh);
  refresh();
}

/* ═══════ Modal ═══════ */
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function openModal({title, fields, onSave, saveLabel, extraHtml}){
  const root = document.getElementById('modal-root');
  const body = (extraHtml||'') + fields.map(f => renderField(f)).join('');
  root.innerHTML = `
  <div class="modal-bg" id="modal-bg">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3>${title}</h3>
        <button type="button" class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
        <button type="button" class="btn btn-primary" id="modal-save">${saveLabel||'حفظ'}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-bg').addEventListener('click', e => { if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('modal-save').onclick = () => {
    if(!validateFields(fields)) return;
    const vals = {};
    fields.forEach(f => {
      const el = document.getElementById('f_'+f.name);
      vals[f.name] = el ? el.value.trim() : '';
    });
    onSave(vals);
  };
  setTimeout(()=>{ const first = root.querySelector('input:not([type=hidden]),select,textarea'); if(first) first.focus(); }, 80);
  fields.forEach(f => { if(f.picker) bindEmpPicker(f.name); });
  if(window._onModalReady) { window._onModalReady(); window._onModalReady=null; }
}

function renderField(f){
  if(f.type==='raw') return f.html||'';
  if(f.type==='section') return `<div class="form-section">${f.label}</div>`;
  const req = f.required ? '<span class="req">*</span>' : '';
  const hint = f.hint ? `<div class="hint" id="hint_${f.name}">${f.hint}</div>` : '';
  const err = `<div class="err-msg" id="err_${f.name}">مطلوب</div>`;
  if(f.type==='select'){
    const opts = (f.options||[]).map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(f.value)?'selected':''}>${esc(o.t)}</option>`).join('');
    return `<div class="form-group" id="fg_${f.name}"><label>${req}${f.label}</label><select id="f_${f.name}">${opts}</select>${hint}${err}</div>`;
  }
  if(f.type==='textarea'){
    return `<div class="form-group" id="fg_${f.name}"><label>${req}${f.label}</label><textarea id="f_${f.name}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>${hint}${err}</div>`;
  }
  if(f.picker){
    return `<div class="form-group" id="fg_${f.name}"><label>${req}${f.label}</label>
      <input type="text" id="f_${f.name}_search" placeholder="ابحث عن الموظف..." autocomplete="off">
      <input type="hidden" id="f_${f.name}" value="${esc(f.value??'')}">
      <div class="emp-picker" id="picker_${f.name}"></div>
      <div class="hint" id="picked_${f.name}">${f.value?'المحدد: #'+f.value:'اختر موظفاً'}</div>${err}</div>`;
  }
  return `<div class="form-group" id="fg_${f.name}"><label>${req}${f.label}</label>
    <input type="${f.type||'text'}" id="f_${f.name}" value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}" ${f.attrs||''} inputmode="${f.inputmode||''}">
    ${hint}${err}</div>`;
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function validateFields(fields){
  let ok=true;
  fields.forEach(f=>{
    if(f.type==='section') return;
    const fg=document.getElementById('fg_'+f.name); if(!fg) return;
    fg.classList.remove('has-error');
    if(!f.required) return;
    let val='';
    if(f.picker) val=document.getElementById('f_'+f.name).value;
    else { const el=document.getElementById('f_'+f.name); val=el?el.value.trim():''; }
    if(!val){ fg.classList.add('has-error'); ok=false; }
  });
  if(!ok) toast('يرجى إكمال الحقول المطلوبة', true);
  return ok;
}

function bindEmpPicker(name){
  const search=document.getElementById('f_'+name+'_search');
  const hidden=document.getElementById('f_'+name);
  const box=document.getElementById('picker_'+name);
  const picked=document.getElementById('picked_'+name);
  if(!search) return;
  if(hidden.value){
    const e=DB.employees.find(x=>x.id==hidden.value);
    if(e){ search.value=`#${e.id} — ${fmt(e.nom_ar)} ${fmt(e.prenom_ar)}`; picked.textContent=`المحدد: #${e.id} · ${fmt(e.nom_ar)} ${fmt(e.prenom_ar)}`; }
  }
  search.addEventListener('input', ()=>{
    const q=search.value.trim().toLowerCase();
    if(q.length<1){ box.classList.remove('open'); return; }
    const res=DB.employees.filter(e=>
      String(e.id).includes(q)||(e.nom_ar||'').includes(q)||(e.prenom_ar||'').includes(q)||(e.nom_prenom||'').toLowerCase().includes(q)
    ).slice(0,12);
    box.innerHTML=res.length?res.map(e=>`<div class="ep-item" data-id="${e.id}"><strong>#${e.id}</strong> — ${fmt(e.nom_ar)} ${fmt(e.prenom_ar)}<small>${fmt(e.nom_prenom)}</small></div>`).join(''):'<div class="ep-item">لا نتائج</div>';
    box.classList.add('open');
    box.querySelectorAll('.ep-item[data-id]').forEach(el=>{
      el.onclick=()=>{
        const id=el.dataset.id; const emp=DB.employees.find(x=>x.id==id);
        hidden.value=id; search.value=`#${id} — ${fmt(emp.nom_ar)} ${fmt(emp.prenom_ar)}`;
        picked.textContent=`المحدد: #${id} · ${fmt(emp.nom_ar)} ${fmt(emp.prenom_ar)}`;
        box.classList.remove('open');
        document.getElementById('fg_'+name).classList.remove('has-error');
        hidden.dispatchEvent(new Event('change'));
      };
    });
  });
}

/* ═══════ Employee CRUD ═══════ */
function findDuplicateEmployees(vals, excludeId){
  const rip=(vals.rip||'').trim();
  const nom=(vals.nom_ar||'').trim(), prenom=(vals.prenom_ar||'').trim();
  return DB.employees.filter(e=>{
    if(excludeId!=null && e.id==excludeId) return false;
    const sameRip = rip && e.rip && String(e.rip).trim()===rip;
    const sameName = nom && prenom && (e.nom_ar||'').trim()===nom && (e.prenom_ar||'').trim()===prenom;
    return sameRip || sameName;
  });
}

function saveNewEmployee(vals){
  const id=nextId();
  const e={id, nom_ar:vals.nom_ar, prenom_ar:vals.prenom_ar, nom_prenom:vals.nom_prenom,
    sex:vals.sex||null, tel:normalizePhoneDZ(vals.tel)||null, email:(vals.email||'').trim()||null,
    statut_emploi:vals.statut_emploi||'يعمل', date_naissance:vals.date_naissance, rip:vals.rip||null, num_ss:vals.num_ss||null,
    total_aide:0, aide_paye:0, total_credit:0, credit_paye:0, credit_restant:0, enfants_m:0, enfants_f:0};
  if(vals.statut_emploi==='متقاعد'||vals.statut_emploi==='متوقف عن العمل'){
    Object.assign(e,{date_retraite:vals.date_retraite||'', retrait_dec_num:vals.retrait_dec_num||'', retrait_dec_date:vals.retrait_dec_date||'', retrait_note:vals.retrait_note||''});
  }
  if(vals.statut_emploi && vals.statut_emploi!=='يعمل'){
    e.statut_log=[{from:'جديد', to:vals.statut_emploi, date:new Date().toISOString(), by:SETTINGS.user||'المستخدم'}];
  }
  DB.employees.push(e);
  saveDB(); closeModal(); openEmployee(id);
}
function logStatusChange(e, newStatut){
  const oldStatut=e.statut_emploi||'يعمل';
  if(oldStatut===newStatut) return false;
  if(!Array.isArray(e.statut_log)) e.statut_log=[];
  e.statut_log.unshift({from:oldStatut, to:newStatut, date:new Date().toISOString(), by:SETTINGS.user||'المستخدم'});
  return true;
}

function empPayCreditTotals(empId, excludePayment){
  const credit=DB.credits.filter(c=>c.employee_id==empId).reduce((s,c)=>s+(+c.montant||0),0);
  const paid=DB.payments.filter(p=>p.employee_id==empId && p!==excludePayment).reduce((s,p)=>s+(+p.montant||0),0);
  return {credit, paid};
}
function checkOverpay(empId, montant, excludePayment){
  const {credit, paid}=empPayCreditTotals(empId, excludePayment);
  const max=credit-paid;
  if(montant - max > 0.5){
    toast(`🚫 رفض التسديد: المجموع سيصبح ${money(paid+montant)} دج وهو أكبر من مجموع القروض (${money(credit)} دج). الحد الأقصى المسموح: ${money(Math.max(0,max))} دج`, true);
    return false;
  }
  return true;
}

function showEditPayment(empId, localIdx){
  const list=DB.payments.filter(p=>p.employee_id==empId); const p=list[localIdx]; if(!p) return;

function pagerHtml(page, total, prevFn, nextFn){

    <button type="button" ${page<=1?'disabled':''} onclick="${prevFn}">→ السابق</button>
    <span>صفحة ${page} / ${total}</span>
    <button type="button" ${page>=total?'disabled':''} onclick="${nextFn}">التالي ←</button>
  </div>`;
}

  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);

/* ═══════ Reports & Printing ═══════ */
const nz = v => (+v)||0;
const sumOf = (arr,f) => arr.reduce((s,x)=>s+nz(f(x)),0);
function groupBy(arr, keyFn, valFn){
  const m={};
  arr.forEach(x=>{
    let k=keyFn(x); k=(k==null||k==='')?'غير محدد':String(k);
    if(!m[k]) m[k]={c:0,s:0};
    m[k].c++; m[k].s+=nz(valFn(x));
  });
  return Object.entries(m).map(([k,v])=>({k,c:v.c,s:v.s}));
}
function reportTable(headers, rows){
  if(!rows.length) return '<div class="empty">لا توجد بيانات</div>';
  return `<div class="table-wrap"><table class="report-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function printTable(headers, rows){
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function barChart(data){
  if(!data.length) return '<div class="empty">لا توجد بيانات</div>';
  const mx=Math.max(...data.map(d=>d.s),1);
  return data.map(d=>`<div class="bar-row"><span>${d.k}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,Math.round(d.s/mx*100))}%"></div></div><span class="money">${money(d.s)} دج</span></div>`).join('');
}
function donutChart(data, total){
  if(!data.length) return '<div class="empty">لا توجد بيانات</div>';
  const tot=data.reduce((a,d)=>a+d.s,0)||1;
  let acc=0;
  const stops=data.map(d=>{ const from=acc/tot*360; acc+=d.s; const to=acc/tot*360; return `${d.color} ${from}deg ${to}deg`; }).join(', ');
  const legend=data.map(d=>`
    <div class="legend-item">
      <span class="legend-dot" style="background:${d.color}"></span>
      <span class="nm">${d.k}<small>${d.c} منحة · ${total?Math.round(d.s/total*100):0}%</small></span>
      <span class="val">${money(d.s)} دج</span>
    </div>`).join('');
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${stops})">
      <div class="donut-center"><div class="n">${money(tot)}</div><div class="l">دج إجمالي</div></div>
    </div>
    <div class="donut-legend">${legend}</div>
  </div>`;
}
function reportYearData(y){
  return {
    aides: y?DB.aides.filter(a=>String(a.annee)==y):DB.aides,
    credits: y?DB.credits.filter(c=>String(c.annee)==y):DB.credits,

  const byCreditType=groupBy(credits,c=>c.type_credit,c=>c.montant).sort((a,b)=>b.s-a.s);
  const restMap={}; groupBy(credits,c=>c.type_credit,c=>c.restant).forEach(x=>restMap[x.k]=x.s);
  html+=`<div class="report-card"><div class="section-title" style="margin-top:0"><span>💳 القروض</span></div>
    <div class="detail-row"><span class="k">الممنوح</span><span class="v money">${money(tCredit)} دج</span></div>
    <div class="detail-row"><span class="k">المسدد</span><span class="v money" style="color:var(--accent)">${money(tCreditPaid)} دج</span></div>
    <div class="detail-row"><span class="k">المتبقي</span><span class="v money" style="color:var(--danger)">${money(tCreditRest)} دج</span></div>
    ${reportTable(['النوع','العدد','الإجمالي (دج)','المتبقي (دج)'],byCreditType.map(t=>[`<strong>${t.k}</strong>`,String(t.c),`<span class="money">${money(t.s)}</span>`,`<span class="money" style="color:var(--danger)">${money(restMap[t.k]||0)}</span>`]))}</div>`;

  if(!y){
    const payByYear=groupBy(DB.payments,p=>String(p.date_pay||'').slice(0,4),p=>p.montant).sort((a,b)=>nz(b.k)-nz(a.k));
    html+=`<div class="report-card"><div class="section-title" style="margin-top:0"><span>💰 تدفق التسديدات حسب السنة</span></div>${barChart(payByYear)}</div>`;
  }

  const byReqYear=groupBy(reqs,r=>r.annee_demande,r=>r.montant).sort((a,b)=>nz(b.k)-nz(a.k));
  const byAvis=groupBy(reqs,r=>r.avis_comite,r=>r.montant).sort((a,b)=>b.s-a.s);
  const motifs=groupBy(reqs,r=>r.note,r=>r.montant).sort((a,b)=>b.c-a.c).slice(0,8);
  html+=`<div class="report-card"><div class="section-title" style="margin-top:0"><span>📝 طلبات السلف</span></div>
    <div class="detail-row"><span class="k">إجمالي المطلوب</span><span class="v money">${money(tReq)} دج</span></div>
    ${reportTable(['سنة الطلب','العدد','المبلغ المطلوب (دج)'],byReqYear.map(r=>[`<strong>${r.k}</strong>`,String(r.c),`<span class="money">${money(r.s)}</span>`]))}
    <div class="section-title" style="margin-top:12px"><span>📌 الأسباب الشائعة</span></div>
    ${motifs.length?motifs.map(m=>`<div class="detail-row"><span class="k">${m.k}</span><span class="v">${m.c} طلب · <span class="money">${money(m.s)} دج</span></span></div>`).join(''):'<div class="empty">لا توجد بيانات</div>'}
    ${reportTable(['رأي اللجنة','العدد','المبلغ (دج)'],byAvis.map(a=>[a.k,String(a.c),`<span class="money">${money(a.s)}</span>`]))}</div>`;

  const topEmp=[...DB.employees].filter(e=>nz(e.total_aide)>0).sort((a,b)=>nz(b.total_aide)-nz(a.total_aide)).slice(0,10);
  html+=`<div class="report-card"><div class="section-title" style="margin-top:0"><span>🏆 أعلى المستفيدين من المنح</span></div>${reportTable(['#','اللقب','الاسم','المنح (دج)','القروض (دج)','المتبقي (دج)'],topEmp.map(e=>[String(e.id),`<strong>${fmt(e.nom_ar)}</strong>`,fmt(e.prenom_ar),`<span class="money">${money(e.total_aide)}</span>`,`<span class="money">${money(e.total_credit)}</span>`,`<span class="money" style="color:var(--danger)">${money(e.credit_restant)}</span>`]))}</div>`;

  const exclRet=document.getElementById('rep-excl-ret')?.checked;
  let topDebt=[...DB.employees].filter(e=>nz(e.credit_restant)>0);
  if(exclRet) topDebt=topDebt.filter(e=>!isRetired(e));
  topDebt=topDebt.sort((a,b)=>nz(b.credit_restant)-nz(a.credit_restant)).slice(0,15);
  html+=`<div class="report-card"><div class="section-title" style="margin-top:0"><span>🚨 أعلى 15 موظفاً عليهم ديون متبقية${exclRet?' <span class="badge yellow">بدون المتقاعدين</span>':''}</span></div>${reportTable(['#','اللقب','الاسم','الحالة','المقترض (دج)','المسدد (دج)','المتبقي (دج)'],topDebt.map(e=>[String(e.id),`<strong>${fmt(e.nom_ar)}</strong>`,fmt(e.prenom_ar),empStatutBadge(e),`<span class="money">${money(e.total_credit)}</span>`,`<span class="money" style="color:var(--accent)">${money(nz(e.total_credit)-nz(e.credit_restant))}</span>`,`<span class="money" style="${isRetired(e)?'color:#fde047':'color:var(--danger)'}">${money(e.credit_restant)}</span>`]))}</div>`;

  const emps=applyEmpFilters([...DB.employees],'rep-sex','rep-age').sort((a,b)=>(a.nom_ar||'').localeCompare(b.nom_ar||'','ar'));
  html+=`<div class="report-card"><div class="section-title" style="margin-top:0"><span>👥 سجل الموظفين (${emps.length})</span></div>${reportTable(['#','اللقب','الاسم','الجنس','العمر','RIP','المنح (دج)','القروض (دج)','المتبقي (دج)'],emps.map(e=>[String(e.id),`<strong>${fmt(e.nom_ar)}</strong>`,fmt(e.prenom_ar),sexLabel(e),ageOf(e.date_naissance)??'—',`<span style="font-family:ui-monospace,monospace;font-size:.7rem">${maskRip(e.rip)}</span>`,`<span class="money">${money(e.total_aide)}</span>`,`<span class="money">${money(e.total_credit)}</span>`,`<span class="money" style="color:var(--danger)">${money(e.credit_restant)}</span>`]))}</div>`;

  document.getElementById('reports-body').innerHTML=html;
}

function printHTML(title, body){
  const area=document.getElementById('print-area');
  area.innerHTML=`<h1>🏛️ الخدمات الاجتماعية — ولاية الأغواط</h1>
    <div class="ph">${title}</div>
    <div class="ph">تاريخ الطباعة: ${new Date().toLocaleString('ar-DZ')}</div>

  const prev=document.title;
  document.title=title;
  window.print();
  document.title=prev;
}

function printReports(){
  const y=document.getElementById('report-year').value;

  const tAide=sumOf(aides,a=>a.montant), tCredit=sumOf(credits,c=>c.montant),
        tCreditRest=sumOf(credits,c=>c.restant), tReq=sumOf(reqs,r=>r.montant), tPay=sumOf(pays,p=>p.montant);
  let b=`<h2>📋 الملخص ${y?'— سنة '+y:'العام'}</h2>`;
  b+=printTable(['البيان','القيمة'],[
    ['عدد الموظفين',String(DB.employees.length)],
    ['عدد المنح',aides.length+' (إجمالي '+money(tAide)+' دج)'],
    ['عدد القروض',credits.length+' (إجمالي '+money(tCredit)+' دج · متبقي '+money(tCreditRest)+' دج)'],
    ['طلبات السلف',reqs.length+' (مطلوب '+money(tReq)+' دج)'],
    ['التسديدات',pays.length+' (إجمالي '+money(tPay)+' دج)']

  const byYear=groupBy(DB.aides,a=>a.annee,a=>a.montant).sort((a,b)=>nz(b.k)-nz(a.k));
  b+=`<h2>📈 المنح حسب السنة</h2>`+printTable(['السنة','العدد','الإجمالي (دج)'],byYear.map(r=>[r.k,String(r.c),money(r.s)]));
  const byType=groupBy(aides,a=>a.type_aide_ar,a=>a.montant).sort((a,b)=>b.s-a.s);
  b+=`<h2>🎁 المنح حسب النوع</h2>`+printTable(['النوع','العدد','الإجمالي (دج)'],byType.map(r=>[r.k,String(r.c),money(r.s)]));
  const bySt=groupBy(aides,a=>a.statut,a=>a.montant).sort((a,b)=>b.s-a.s);
  b+=`<h2>✅ المنح حسب الحالة</h2>`+printTable(['الحالة','العدد','الإجمالي (دج)'],bySt.map(r=>[r.k,String(r.c),money(r.s)]));
  const recRate=tCredit>0?(tPay/tCredit*100):0;
  const retiredIdsP=new Set(DB.employees.filter(isRetired).map(e=>e.id));
  const tUncolP=sumOf(credits.filter(c=>retiredIdsP.has(c.employee_id)),c=>c.restant);
  const recRateAdjP=(tCredit-tUncolP)>0?(tPay/(tCredit-tUncolP)*100):0;
  b+=`<h2>💰 ملخص الميزانية</h2>`+printTable(['البيان','القيمة'],[
    ['السلفات الممنوحة',money(tCredit)+' دج'],
    ['المنح (نفقات)',money(tAide)+' دج'],
    ['إجمالي النفقات',money(tCredit+tAide)+' دج'],
    ['الاستردادات',money(tPay)+' دج'],
    ['الرصيد الصافي المتبقي',money(tCreditRest)+' دج'],
    ['منها غير قابل للتحصيل (متقاعدون)',money(tUncolP)+' دج'],
    ['نسبة الاسترداد (الإجمالية)',recRate.toFixed(1)+'%'],
    ['نسبة الاسترداد (قابل للتحصيل فقط)',recRateAdjP.toFixed(1)+'%']
  ]);
  const motifs=groupBy(reqs,r=>r.note,r=>r.montant).sort((a,b)=>b.c-a.c).slice(0,8);
  b+=`<h2>📌 أسباب طلبات السلف الشائعة</h2>`+printTable(['السبب','عدد الطلبات','المبلغ (دج)'],motifs.map(m=>[m.k,String(m.c),money(m.s)]));
  const exclRetP=document.getElementById('rep-excl-ret')?.checked;
  let topDebt=[...DB.employees].filter(e=>nz(e.credit_restant)>0);
  if(exclRetP) topDebt=topDebt.filter(e=>!isRetired(e));
  topDebt=topDebt.sort((a,b)=>nz(b.credit_restant)-nz(a.credit_restant)).slice(0,15);
  b+=`<h2>🚨 أعلى 15 موظفاً عليهم ديون متبقية${exclRetP?' (بدون المتقاعدين)':''}</h2>`+printTable(['#','اللقب','الاسم','الحالة','المقترض (دج)','المسدد (دج)','المتبقي (دج)'],topDebt.map(e=>[String(e.id),fmt(e.nom_ar),fmt(e.prenom_ar),(e.statut_emploi&&e.statut_emploi!=='يعمل')?e.statut_emploi:'يعمل',money(e.total_credit),money(nz(e.total_credit)-nz(e.credit_restant)),money(e.credit_restant)]));
  const emps=[...DB.employees].sort((a,b)=>(a.nom_ar||'').localeCompare(b.nom_ar||'','ar'));
  b+=`<h2>👥 سجل الموظفين (${emps.length})</h2>`+printTable(['#','اللقب','الاسم','RIP','المنح (دج)','القروض (دج)','المتبقي (دج)'],emps.map(e=>[String(e.id),fmt(e.nom_ar),fmt(e.prenom_ar),maskRip(e.rip),money(e.total_aide),money(e.total_credit),money(e.credit_restant)]));
  printHTML('تقرير الخدمات الاجتماعية', b);
}

function exportReportCSV(){
  const list=applyEmpFilters([...DB.employees],'rep-sex','rep-age');
  const doExport=ripVisible=>{
    const ripFmt=v=>ripVisible?String(v??''):String(v??'').replace(/.(?=.{4})/g,'•');
    const head=['id','اللقب','الاسم','الاسم باللاتينية','الجنس','العمر','تاريخ الميلاد','RIP','رقم الضمان','الهاتف','البريد الإلكتروني','إجمالي المنح','إجمالي القروض','متبقي القروض'];
    const rows=list.map(e=>[e.id,e.nom_ar||'',e.prenom_ar||'',e.nom_prenom||'',sexLabel(e),ageOf(e.date_naissance)??'',e.date_naissance||'',ripFmt(e.rip),e.num_ss||'',e.tel||'',e.email||'',nz(e.total_aide),nz(e.total_credit),nz(e.credit_restant)]);
    const csv='\uFEFF'+[head,...rows].map(r=>r.map(c=>{ c=String(c); return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='employees_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    toast('تم تصدير CSV ✓'+(ripVisible?' (RIP مكشوفة)':' (RIP مقنّعة)'));
  };
  if(SETTINGS.ripHidden){
    openConfirmEx({
      title:'📄 خصوصية أرقام RIP', yesLabel:'تصدير RIP مكشوفة', yesClass:'btn-green',
      html:`<div class="confirm-box" style="text-align:right">
        <p>⚠️ أرقام RIP مخفية حالياً في التطبيق.</p>
        <p style="margin-top:8px">اختر <strong>«تصدير RIP مكشوفة»</strong> إذا كنت تحتاج الأرقام الحقيقية في ملف Excel، أو <strong>«إلغاء»</strong> لتصديرها مقنّعة.</p>
      </div>`,
      onYes:()=>doExport(true)
    });
  } else doExport(true);
}

function printReceipt(empId, idx){
  const e=DB.employees.find(x=>x.id==empId); if(!e) return;
  const pays=DB.payments.filter(p=>p.employee_id==empId);
  const p=pays[idx]; if(!p) return;
  const credits=DB.credits.filter(c=>c.employee_id==empId);
  const totalCredit=credits.reduce((s,c)=>s+(+c.montant||0),0);
  const totalPaid=pays.reduce((s,x)=>s+(+x.montant||0),0);
  const resteApres=(+p.dette||0)||Math.max(0,totalCredit-totalPaid);
  const linked=credits.find(c=>c.id==p.credit_id);
  const b=`
    <div class="pk">وصل تسديد</div>
    <h1>🏛️ الخدمات الاجتماعية — ولاية الأغواط</h1>
    <table>
      <tr><th style="width:28%">رقم الوصل</th><td style="width:22%">${String(p.date_pay||'').slice(0,4)}/${String(idx+1).padStart(3,'0')}</td><th style="width:25%">تاريخ التسديد</th><td>${fmt(p.date_pay).slice(0,10)}</td></tr>
      <tr><th>الموظف</th><td colspan="3"><strong>${fmt(e.nom_ar)} ${fmt(e.prenom_ar)}</strong> — رقمه #${e.id}</td></tr>
      <tr><th>المبلغ المسدد</th><td colspan="3"><strong style="font-size:16px">${money(p.montant)} دج</strong></td></tr>
      <tr><th>مصلحة التسديد</th><td colspan="3">${linked?`${fmt(linked.type_credit)} ${fmt(linked.annee)} (رمز ${fmt(p.code_credit||linked.id)})`:(p.code_credit?`رمز القرض: ${fmt(p.code_credit)}`:'—')}</td></tr>
      <tr><th>مجموع القروض</th><td>${money(totalCredit)} دج</td><th>المسدد حتى اليوم</th><td>${money(totalPaid)} دج</td></tr>
      <tr><th>المتبقي بعد التسديد</th><td colspan="3"><strong>${money(resteApres)} دج</strong></td></tr>
    </table>
    <table style="margin-top:46px">
      <tr><th style="width:33%;border:none;background:transparent !important">توقيع المستلم</th><th style="width:34%;border:none;background:transparent !important">أمين الصندوق</th><th style="width:33%;border:none;background:transparent !important">ختم الجمعية</th></tr>
      <tr><td style="border:none;height:60px"></td><td style="border:none"></td><td style="border:none"></td></tr>
    </table>`;

/* ═══════ 📅 خطة تسديد القرض بالأقساط ═══════ */
let _sched={empId:null, idx:null, rows:[]};
function showCreditSchedule(empId, idx){
  const c=DB.credits.filter(x=>x.employee_id==empId)[idx]; if(!c) return;
  const rest=nz(c.restant);
  if(rest<=0){ toast('هذا القرض مسدد بالكامل ✓', true); return; }
  _sched={empId, idx, rows:[]};
  const defAmount=Math.ceil(rest/10/500)*500;
  const html=`
    <div class="form-group"><label>طريقة الحساب</label>
      <select id="sched-mode" onchange="recalcSchedule()">
        <option value="months">حسب عدد الأشهر</option>
        <option value="amount">حسب القسط الشهري</option>
      </select></div>
    <div class="form-group" id="sched-months-wrap"><label>عدد الأشهر</label>
      <input type="number" id="sched-months" inputmode="numeric" value="10" oninput="recalcSchedule()"></div>
    <div class="form-group" id="sched-amount-wrap" style="display:none"><label>القسط الشهري (دج)</label>
      <input type="number" id="sched-amount" inputmode="numeric" value="${defAmount}" oninput="recalcSchedule()"></div>
    <div class="form-group"><label>تاريخ بداية التسديد</label>
      <input type="date" id="sched-start" value="${new Date().toISOString().slice(0,10)}" onchange="recalcSchedule()"></div>
    <div id="sched-out"></div>
    <div class="btn-row" style="margin-bottom:0"><button type="button" class="btn btn-primary btn-sm" onclick="printSchedule()">🖨️ طباعة الخطة</button></div>`;
  openHtmlModal({title:'📅 خطة تسديد القرض', html, okLabel:'إغلاق'});
  recalcSchedule();
}
function recalcSchedule(){
  const c=DB.credits.filter(x=>x.employee_id==_sched.empId)[_sched.idx]; if(!c) return;
  const rest=nz(c.restant);
  const modeEl=document.getElementById('sched-mode'); if(!modeEl) return;
  const mode=modeEl.value;
  const mw=document.getElementById('sched-months-wrap'), aw=document.getElementById('sched-amount-wrap');
  if(mw) mw.style.display=mode==='months'?'':'none';
  if(aw) aw.style.display=mode==='amount'?'':'none';
  let monthly;
  if(mode==='months'){
    const m=Math.max(1, +document.getElementById('sched-months').value||1);
    monthly=rest/m;
  }else{
    monthly=+document.getElementById('sched-amount').value||0;
  }
  const start=document.getElementById('sched-start').value||new Date().toISOString().slice(0,10);
  _sched.rows=buildScheduleRows(rest, monthly, start);
  document.getElementById('sched-out').innerHTML=scheduleTableHtml(_sched.rows);
}
function buildScheduleRows(rest, monthly, start){
  const rows=[]; if(!(monthly>0)) return rows;
  const d=new Date(start+'T12:00:00');
  let rem=rest, acc=0, i=1;
  while(rem>0.5 && i<=360){
    let pay=Math.min(monthly, rem);
    pay=Math.round(pay*100)/100;
    rem=Math.round((rem-pay)*100)/100; if(rem<0.5) rem=0;
    acc=Math.round((acc+pay)*100)/100;
    const p2=n=>String(n).padStart(2,'0');
    rows.push({n:i, date:`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`, pay, acc, rem});
    d.setMonth(d.getMonth()+1); i++;
  }
  return rows;
}
function scheduleTableHtml(rows){
  if(!rows.length) return '<div class="empty">أدخل قسطاً أو عدداً صالحاً</div>';
  return `<div class="table-wrap"><table class="report-table"><thead><tr><th>#</th><th>الشهر</th><th>القسط (دج)</th><th>التراكمي</th><th>المتبقي</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.n}</td><td>${r.date}</td><td class="num">${money(r.pay)}</td><td class="num">${money(r.acc)}</td><td class="num" style="color:${r.rem>0?'var(--danger)':'var(--accent)'}">${money(r.rem)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="detail-row"><span class="k">المدة المتوقعة</span><span class="v">${rows.length} شهراً</span></div>`;
}
function printSchedule(){
  const c=DB.credits.filter(x=>x.employee_id==_sched.empId)[_sched.idx]; if(!c) return;
  const e=DB.employees.find(x=>x.id==_sched.empId);
  const rows=_sched.rows||[];
  let b=`<h2>📅 خطة تسديد: ${fmt(c.type_credit)} ${fmt(c.annee||'')}</h2>
    <table><tr><th>الموظف</th><td colspan="3">${fmt(e?.nom_ar)} ${fmt(e?.prenom_ar)} — #${_sched.empId}</td></tr>
    <tr><th>مبلغ القرض</th><td>${money(c.montant)} دج</td><th>المتبقي</th><td>${money(c.restant)} دج</td></tr></table>
    ${scheduleTableHtml(rows)}`;
  printHTML('خطة تسديد قرض', b);
}

/* ═══════ 📥 استيراد سجل الموظفين من CSV/Excel ═══════ */
function csvSplit(line, delim){
  const out=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===delim){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function handleCsvImport(ev){
  const file=ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    let text=String(e.target.result);
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){ toast('الملف فارغ أو بلا صفوف', true); return; }
    const delim=lines[0].includes(';')?';':(lines[0].includes('\t')?'\t':',');
    const head=csvSplit(lines[0], delim);
    const col=n=>head.findIndex(h=>h===n);
    const idx={id:col('id'), nom:col('اللقب'), prenom:col('الاسم'), nomp:col('الاسم باللاتينية'),
      sex:col('الجنس'), dn:col('تاريخ الميلاد'), rip:col('RIP'), ss:col('رقم الضمان'),
      tel:col('الهاتف'), email:col('البريد الإلكتروني')};
    if(idx.id<0||idx.nom<0||idx.prenom<0){ toast('صيغة غير معروفة — استخدم ملف «📄 تصدير Excel/CSV» كنموذج', true); return; }
    const sexMap={'ذكر':'M','أنثى':'F','M':'M','F':'F','male':'M','female':'F'};
    const updates=[], adds=[]; let skip=0;
    for(let i=1;i<lines.length;i++){
      const c=csvSplit(lines[i], delim);
      const idVal=(c[idx.id]||'').trim();
      const nomAr=c[idx.nom]||'', prenomAr=c[idx.prenom]||'';
      if(!idVal || (!nomAr && !prenomAr)){ skip++; continue; }
      const vals={
        nom_ar:nomAr, prenom_ar:prenomAr,
        nom_prenom:idx.nomp>=0?(c[idx.nomp]||''):'',
        sex:idx.sex>=0?(sexMap[(c[idx.sex]||'').trim()]||''):'',
        date_naissance:idx.dn>=0?(c[idx.dn]||''):'',
        rip:idx.rip>=0?(c[idx.rip]||''):'',
        num_ss:idx.ss>=0?(c[idx.ss]||''):'',
        tel:idx.tel>=0?normalizePhoneDZ(c[idx.tel]||''):'',
        email:idx.email>=0?(c[idx.email]||'').trim():''
      };
      const ex=DB.employees.find(x=>String(x.id)===idVal);
      if(ex) updates.push({ex, vals});
      else if(/^\d+$/.test(idVal) && !DB.employees.some(x=>x.id===+idVal)) adds.push({id:+idVal, vals});
      else skip++;
    }
    if(!updates.length && !adds.length){ toast('لا توجد صفوف صالحة للاستيراد', true); return; }
    openConfirmEx({
      title:'📥 استيراد سجل الموظفين', yesLabel:`تنفيذ (${updates.length} تحديث · ${adds.length} إضافة)`,
      html:`<div class="confirm-box" style="text-align:right">
        <div class="detail-row"><span class="k">تحديث موظفين موجودين</span><span class="v">${updates.length}</span></div>
        <div class="detail-row"><span class="k">إضافة موظفين جدد</span><span class="v">${adds.length}</span></div>
        <div class="detail-row"><span class="k">صفوف متجاهَلة (بلا رقم/اسم)</span><span class="v">${skip}</span></div>
        <p style="font-size:.72rem;color:var(--muted);margin-top:10px">⚠️ التحديث يشمل: الأسماء، الجنس، تاريخ الميلاد، RIP، رقم الضمان، الهاتف، البريد الإلكتروني. الإجماليات تُحسب تلقائياً من القروض والمنح.</p>
      </div>`,
      onYes:()=>{
        updates.forEach(u=>{ Object.assign(u.ex, u.vals); recalcEmp(u.ex.id); });
        adds.forEach(a=>{
          DB.employees.push({id:a.id, ...a.vals, statut_emploi:'يعمل', total_aide:0, aide_paye:0, total_credit:0, credit_paye:0, credit_restant:0, enfants_m:0, enfants_f:0});
          recalcEmp(a.id);
        });
        saveDB(); renderHome(); rerenderCurrent();
        toast(`تم الاستيراد ✓ (${updates.length} تحديث · ${adds.length} إضافة)`);
      }
    });
  };
  reader.readAsText(file, 'utf-8');
}
